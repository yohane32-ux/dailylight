<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pamoja · Share</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1512">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#0E1512;color:#EAF2EE;font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:460px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 28px;text-align:center}
  h1{font-family:Fredoka,Nunito,sans-serif;font-size:24px;margin:6px 0 14px}
  .pic{width:100%;max-width:360px;aspect-ratio:1/1;margin:0 auto;border-radius:22px;overflow:hidden;background:#17211D;display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .pic img{width:100%;height:100%;display:block;-webkit-touch-callout:default}
  .hint{font-size:13px;color:#93A39C;margin:10px 0 16px;line-height:1.5}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:16px;font:800 17px Nunito,system-ui,sans-serif;color:#fff;background:#1FA67A;box-shadow:0 4px 0 #14855F;text-decoration:none;margin-top:12px;cursor:pointer}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #14855F}
  .btn.ghost{background:#22302A;box-shadow:none;color:#EAF2EE;font-size:15px;padding:13px}
  .btn.wa{background:#1E9E57;box-shadow:0 4px 0 #157741}
  .msg{min-height:20px;font-size:13px;color:#C8D4CF;margin-top:10px}
  .txt{background:#17211D;border-radius:12px;padding:10px 12px;font-size:13px;color:#93A39C;line-height:1.5;margin-top:14px;text-align:left;-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<main>
  <h1 id="t">📣 Share</h1>
  <div class="pic" id="pic">🏆</div>
  <div class="hint" id="hint"></div>
  <button class="btn" id="share">📤 Share picture</button>
  <a class="btn ghost" id="save" download="pamoja.png">⬇️ Save picture</a>
  <a class="btn ghost wa" id="wa" target="_blank" rel="noopener">WhatsApp (text)</a>
  <div class="msg" id="msg"></div>
  <div class="txt" id="txt"></div>
  <a class="btn ghost" id="back">← Pamoja</a>
</main>
<script>
/* ---- Pamoja share picture (same code in the app and in share.html) ---- */
function shWrap(x,txt,cx,y,maxW,lh,maxLines){
  var words=String(txt||'').split(' '),line='',n=0;
  for(var i=0;i<words.length;i++){var test=line?line+' '+words[i]:words[i];
    if(x.measureText(test).width>maxW&&line){x.fillText(line,cx,y);y+=lh;line=words[i];if(++n>=(maxLines||3)-1){line=words.slice(i).join(' ');break}}else line=test}
  if(line){while(x.measureText(line).width>maxW&&line.length>3)line=line.slice(0,-2);x.fillText(line,cx,y);y+=lh}
  return y;
}
function shRound(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath()}
var PJ_EMOJI=function(sz){return sz+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'};
// a medal: rosette edge, ribbons, metal colour by tier (1 bronze, 2 silver, 3 gold, 4 diamond, 'lv' green)
function pjMedal(x,cx,cy,R,tier,emoji){
  var M={1:['#F3B27A','#8A4B22','#C77B3A'],2:['#FFFFFF','#7D8794','#C9D2DC'],3:['#FFF0A8','#A86E00','#FFD34D'],4:['#E4F2FF','#3D4FC9','#8EC9FF'],lv:['#B9F5DC','#14855F','#4FD6A5']}[tier]||['#B9F5DC','#14855F','#4FD6A5'];
  x.save();
  [-1,1].forEach(function(s){x.fillStyle=s<0?M[1]:M[2];x.beginPath();x.moveTo(cx+s*R*0.18,cy+R*0.55);x.lineTo(cx+s*R*0.62,cy+R*0.42);x.lineTo(cx+s*R*0.72,cy+R*1.45);x.lineTo(cx+s*R*0.5,cy+R*1.28);x.lineTo(cx+s*R*0.32,cy+R*1.5);x.closePath();x.fill()});
  var g=x.createLinearGradient(cx-R,cy-R,cx+R,cy+R);g.addColorStop(0,M[0]);g.addColorStop(.5,M[2]);g.addColorStop(1,M[1]);x.fillStyle=g;
  for(var i=0;i<28;i++){var a=i*Math.PI/14;x.beginPath();x.arc(cx+R*0.92*Math.cos(a),cy+R*0.92*Math.sin(a),R*0.14,0,7);x.fill()}
  x.beginPath();x.arc(cx,cy,R*0.92,0,7);x.fill();
  x.fillStyle='#13201B';x.beginPath();x.arc(cx,cy,R*0.74,0,7);x.fill();
  x.strokeStyle=M[2];x.lineWidth=Math.max(2,R*0.045);x.beginPath();x.arc(cx,cy,R*0.66,0,7);x.stroke();
  x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.font=PJ_EMOJI(Math.round(R*0.78));x.fillText(emoji||'🏅',cx,cy+R*0.04);
  x.restore();
}
// a league shield with Kilimanjaro (same shape as the app's crests). c = [rim light, rim dark, field top, field bottom, accent]
function pjShield(x,cx,cy,size,c,div){
  if(!window.Path2D)return false;
  var s=size/100;x.save();x.translate(cx-50*s,cy-58*s);x.scale(s,s);
  var r=x.createLinearGradient(0,0,100,112);r.addColorStop(0,c[0]);r.addColorStop(.5,c[4]);r.addColorStop(1,c[1]);
  var f=x.createLinearGradient(0,0,0,104);f.addColorStop(0,c[2]);f.addColorStop(1,c[3]);
  var sh=new Path2D('M50 8 L86 21 V52 C86 76 70 92 50 103 C30 92 14 76 14 52 V21 Z');
  x.fillStyle=f;x.fill(sh);x.strokeStyle=r;x.lineWidth=6;x.lineJoin='round';x.stroke(sh);
  x.strokeStyle=c[4];x.globalAlpha=.55;x.lineWidth=1.4;x.stroke(new Path2D('M50 17 L78 27 V52 C78 70 66 83 50 92 C34 83 22 70 22 52 V27 Z'));x.globalAlpha=1;
  x.fillStyle=r;x.fill(new Path2D('M27 72 L42 50 L48 58 L58 40 L73 72 Z'));
  x.fillStyle='#fff';x.fill(new Path2D('M58 40 L62 48.5 L59.6 47 L57.2 50 L55 47.4 L53.3 48.5 Z'));
  x.strokeStyle=c[4];x.lineWidth=2;x.beginPath();x.moveTo(24,72);x.lineTo(76,72);x.stroke();
  if(div){x.fillStyle=c[0];x.textAlign='center';x.font='700 14px Fredoka, Nunito, sans-serif';x.fillText(div,50,90)}
  x.restore();return true;
}
// o: e, big, sub, stats [[emoji,value,label]], c1, c2, medal, shield {c, div}, name, date
function pamojaCard(o,cb){
  function draw(){
    try{
      var W=720,H=720,cv=document.createElement('canvas');cv.width=W;cv.height=H;var x=cv.getContext('2d');
      var g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,o.c1||'#14855F');g.addColorStop(1,o.c2||'#0B1411');x.fillStyle=g;x.fillRect(0,0,W,H);
      x.fillStyle='rgba(255,255,255,.07)';x.beginPath();x.arc(W-40,40,210,0,7);x.fill();x.beginPath();x.arc(60,H-30,170,0,7);x.fill();
      var F=function(sz,w){return (w||'700')+' '+sz+'px Fredoka, Nunito, "Segoe UI", Roboto, sans-serif'};
      x.textAlign='center';x.textBaseline='alphabetic';
      x.fillStyle='rgba(255,255,255,.8)';x.font=F(24,'700');x.fillText('P A M O J A',W/2,58);
      var y0=322,big=52;
      if(o.medal){pjMedal(x,W/2,178,92,o.medal,o.e);y0=362;big=48}
      else if(o.shield&&pjShield(x,W/2,196,196,o.shield.c,o.shield.div)){y0=362;big=48}
      else{x.fillStyle='#fff';x.font=PJ_EMOJI(150);x.fillText(o.e||'🏆',W/2,236)}
      x.fillStyle='#fff';x.font=F(big);var y=shWrap(x,o.big||'',W/2,y0,W-100,big+6,2);
      if(o.sub){x.fillStyle='rgba(255,255,255,.85)';x.font=F(28,'600');y=shWrap(x,o.sub,W/2,y+2,W-120,36,2)}
      var st=(o.stats||[]).slice(0,3);
      if(st.length){var bw=(W-80-(st.length-1)*16)/st.length,bh=120,by=Math.min(H-74-bh,Math.max(y+12,462));
        st.forEach(function(s,i){var bx=40+i*(bw+16);x.fillStyle='rgba(0,0,0,.25)';shRound(x,bx,by,bw,bh,22);x.fill();
          x.fillStyle='#fff';x.font=PJ_EMOJI(30);x.fillText(s[0],bx+bw/2,by+38);x.font=F(36);x.fillText(String(s[1]),bx+bw/2,by+80);x.fillStyle='rgba(255,255,255,.72)';var lb=String(s[2]),fs=19;x.font=F(fs,'700');while(fs>14&&x.measureText(lb).width>bw-16){fs--;x.font=F(fs,'700')}while(lb.length>4&&x.measureText(lb).width>bw-16)lb=lb.slice(0,-2).replace(/\s*…?$/,'')+'…';x.fillText(lb,bx+bw/2,by+106)})}
      x.fillStyle='rgba(255,255,255,.9)';x.font=F(24,'700');x.fillText((o.name||'')+(o.name?'  ·  ':'')+(o.date||'')+'  ·  💚',W/2,H-30);
      var url=cv.toDataURL('image/png');
      if(cv.toBlob)cv.toBlob(function(b){cb(url,b)},'image/png');else cb(url,null);
    }catch(e){cb(null,null)}
  }
  try{(document.fonts&&document.fonts.load?document.fonts.load('700 52px Fredoka'):Promise.resolve()).then(draw,draw)}catch(e){draw()}
}

(function(){
  var o={};try{o=JSON.parse(decodeURIComponent(location.hash.slice(1)))||{}}catch(e){}
  var sw=o.lang==='sw',T=sw?{t:'📣 Shiriki',share:'📤 Shiriki picha',save:'⬇️ Hifadhi picha',wa:'WhatsApp (maandishi)',back:'← Rudi Pamoja',
      hint:'Gusa “Shiriki picha” kuituma picha kwenye WhatsApp, Instagram au popote. Unaweza pia kubonyeza na kushikilia picha.',saved:'Picha imehifadhiwa ✓',nofile:'Simu hii haiwezi kushiriki picha moja kwa moja — gusa “Hifadhi picha”, kisha uitume kutoka kwenye picha zako.'}
    :{t:'📣 Share',share:'📤 Share picture',save:'⬇️ Save picture',wa:'WhatsApp (text only)',back:'← Back to Pamoja',
      hint:'Tap “Share picture” to send it to WhatsApp, Instagram or anywhere. You can also press and hold the picture.',saved:'Picture saved ✓',nofile:'This phone can’t share pictures directly — tap “Save picture”, then send it from your photos.'};
  var $=function(i){return document.getElementById(i)};
  $('t').textContent=T.t;$('share').textContent=T.share;$('save').textContent=T.save;$('wa').textContent=T.wa;$('back').textContent=T.back;$('hint').textContent=T.hint;
  var text=o.text||'#Pamoja 💚';$('txt').textContent=text;$('wa').href='https://wa.me/?text='+encodeURIComponent(text);
  $('back').href=o.back||'./';$('back').onclick=function(e){if(window.opener||history.length<=1){e.preventDefault();window.close();setTimeout(function(){location.href=o.back||'./'},300)}};
  if(o.e)$('pic').textContent=o.e;
  var file=null;
  pamojaCard(o,function(url,blob){
    if(!url)return;
    $('pic').innerHTML='<img alt="">';$('pic').firstChild.src=url;
    if(blob){$('save').href=URL.createObjectURL(blob);try{file=new File([blob],'pamoja.png',{type:'image/png'})}catch(e){}}
    else $('save').href=url;
  });
  $('save').onclick=function(){setTimeout(function(){$('msg').textContent=T.saved},400)};
  $('share').onclick=function(){
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],text:text}).catch(function(e){
        if(e&&e.name==='AbortError')return;
        navigator.share({files:[file]}).catch(function(){$('msg').textContent=T.nofile});
      });
    }else if(navigator.share){$('msg').textContent=T.nofile;navigator.share({text:text}).catch(function(){})}
    else $('msg').textContent=T.nofile;
  };
})();
</script>
</body>
</html>
