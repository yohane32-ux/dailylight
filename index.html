<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- ===================================================================
     DAILY LIGHT · NURU YA KILA SIKU — front door page
     STEP: paste your Apps Script web app link (ends in /exec) below.
     =================================================================== -->
<script>
  const APP_URL = 'https://script.google.com/macros/s/AKfycby6wZ401v8vQjzJ-Xk4mpvl5wBKHrP1KU5qB54nDXaKH0FZmlWVvjbS8hspKVy0OzCJ/exec';
</script>

<title>Daily Light · Nuru ya Kila Siku</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Daily Bible verse, teaching and prayer in English and Kiswahili.">
<meta name="theme-color" content="#2f7a50">

<!-- Home screen icons -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Light">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Daily Light">

<style>
  html, body { margin: 0; height: 100%; background: #f1f6ee; overflow: hidden; }
  body { padding-top: env(safe-area-inset-top); box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  #app { display: block; width: 100%; height: 100%; border: 0; }
  #splash { position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
            background: linear-gradient(180deg, #a8d9ef, #fbe4c3 60%, #f1f6ee); transition: opacity .5s; z-index: 2; }
  #splash img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 10px 30px rgba(25,60,35,.25); }
  #splash h1 { font: 600 26px Georgia, serif; color: #1d2b22; margin: 18px 0 4px; }
  #splash p { color: #4a5e50; margin: 0; }
  #splash .help { margin-top: 26px; font-size: 13px; color: #4a5e50; opacity: 0; transition: opacity .4s; }
  #splash .help a { color: #2f7a50; font-weight: 600; }
  .hide { opacity: 0; pointer-events: none; }
  .setup { max-width: 420px; padding: 24px; background: #fff; border-radius: 16px; color: #1d2b22; line-height: 1.5; }
</style>
</head>
<body>
  <div id="splash">
    <div>
      <img src="icon-192.png" alt="">
      <h1>Daily Light</h1>
      <p>Nuru ya Kila Siku</p>
      <p class="help" id="help">Taking a while? <a id="direct" href="#">Open the app directly</a></p>
    </div>
  </div>
  <iframe id="app" title="Daily Light" allow="clipboard-write"></iframe>

<script>
  const frame = document.getElementById('app');
  const splash = document.getElementById('splash');
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL)) {
    splash.innerHTML = '<div class="setup"><h2>Almost there</h2><p>Open <b>index.html</b> on GitHub, click the ✏️ pencil, and replace <code>PASTE_YOUR_APP_LINK_HERE</code> with your Apps Script web app link (it ends in <code>/exec</code>). Then click <b>Commit changes</b>.</p></div>';
  } else {
    document.getElementById('direct').href = APP_URL;
    frame.src = APP_URL;
    frame.addEventListener('load', () => setTimeout(() => splash.classList.add('hide'), 400));
    setTimeout(() => { document.getElementById('help').style.opacity = 1; }, 8000);
  }
</script>
</body>
</html>
